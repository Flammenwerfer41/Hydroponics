name: Backup Cloudflare data

on:
  schedule:
    # 02:30 JST; GitHub cron uses UTC.
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-hydroponics-cloudflare-data
  cancel-in-progress: false

jobs:
  backup:
    if: vars.CLOUDFLARE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYDRO_BACKUP_BUCKET: hydroponics-backups
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Export, validate and upload backups
        run: pnpm run backup:run
