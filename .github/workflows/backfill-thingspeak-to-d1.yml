name: Backfill ThingSpeak history to D1

on:
  schedule:
    # 09:20 JST, shortly after the D1 free-plan quota resets at 00:00 UTC.
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backfill-thingspeak-to-d1
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Resume bounded historical import
        run: >-
          pnpm backfill:thingspeak --
          --before 2026-08-09T03:49:42Z
          --apply
          --batch-size 50
          --max-rows-written 60000
