<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1714">
  <meta name="robots" content="noindex,nofollow">
  <title>수경재배 재배일지</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../admin.css?v=2">
  <link rel="stylesheet" href="journal.css?v=1">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div><p class="eyebrow">HYDROPONICS · JOURNAL</p><h1>재배일지</h1></div>
      <nav aria-label="대시보드 영역">
        <a href="../../">모니터링</a>
        <a href="../">관리</a>
        <a class="active" href="./" aria-current="page">재배일지</a>
      </nav>
    </header>

    <div class="notice" id="notice" role="status" aria-live="polite">일지를 불러오는 중입니다.</div>

    <main>
      <section id="listView">
        <div class="journal-toolbar panel">
          <div class="filter-grid">
            <label>연도<select id="filterYear"></select></label>
            <label>월<select id="filterMonth"></select></label>
            <label>날짜<select id="filterDay"><option value="">전체</option></select></label>
            <label>작물<select id="filterCrop"><option value="">전체 작물</option></select></label>
            <label>활동<select id="filterTag"><option value="">전체 활동</option></select></label>
          </div>
          <button class="primary new-entry" id="newEntry" type="button">+ 새 일지</button>
        </div>
        <div class="journal-list" id="journalList"></div>
      </section>

      <section id="editorView" hidden>
        <div class="editor-heading">
          <button type="button" id="backToList">← 목록</button>
          <div><p class="kicker">DAILY RECORD</p><h2 id="editorTitle">새 재배일지</h2></div>
        </div>

        <form id="journalForm">
          <section class="panel form-panel">
            <div class="form-row primary-fields">
              <label>기록 날짜<input id="journalDate" type="date" required></label>
              <label>공개 설정
                <select id="journalVisibility">
                  <option value="private">비공개</option>
                  <option value="public">공개 예정</option>
                </select>
              </label>
            </div>
            <label class="wide-label">공통 관리 기록
              <textarea id="commonNote" rows="5" maxlength="20000" placeholder="타워 전체, 양액 관리 또는 그날의 공통 사항을 기록하세요."></textarea>
            </label>
            <p class="field-help">공개 설정은 날짜별 일지 전체에 적용됩니다. 공개 대시보드 노출은 후속 단계에서 연결합니다.</p>
          </section>

          <section class="panel form-panel">
            <div class="panel-heading"><div><p class="kicker">MANUAL VALUES</p><h2>수동 측정과 보충</h2></div><span class="optional">모두 선택 입력</span></div>
            <div class="measurement-grid">
              <label>pH<input id="solutionPh" type="number" inputmode="decimal" min="0" max="14" step="0.01" placeholder="6.10"></label>
              <label>EC <small>mS/cm</small><input id="solutionEc" type="number" inputmode="decimal" min="0" max="20" step="0.01" placeholder="1.40"></label>
              <label>양액 보충량 <small>L</small><input id="topUpVolume" type="number" inputmode="decimal" min="0" max="1000" step="0.1" placeholder="2.5"></label>
              <label>보충 종류
                <select id="topUpType">
                  <option value="prepared_solution">조제된 양액</option>
                  <option value="water">물</option>
                  <option value="concentrate">농축 양액</option>
                  <option value="other">기타</option>
                </select>
              </label>
            </div>
          </section>

          <section class="panel form-panel crop-panel">
            <div class="panel-heading">
              <div><p class="kicker">CROP RECORDS</p><h2>작물별 기록</h2></div>
              <button type="button" id="addSection">+ 작물 추가</button>
            </div>
            <div id="cropSections" class="crop-sections"></div>
            <p id="emptySections" class="empty-copy">작물별 기록이 필요한 경우 작물을 추가하세요.</p>
          </section>

          <div class="editor-actions">
            <button class="primary" type="submit">일지 저장</button>
            <button class="danger" id="deleteEntry" type="button" hidden>일지 삭제</button>
          </div>
        </form>
      </section>
    </main>

    <footer><span id="adminIdentity">Cloudflare Access</span><a href="../../">공개 대시보드로 돌아가기</a></footer>
  </div>
  <template id="sectionTemplate">
    <article class="crop-section">
      <div class="section-head">
        <label>작물<select class="section-crop"></select></label>
        <button class="remove-section" type="button">기록 제거</button>
      </div>
      <label>소제목 <small>선택</small><input class="section-title" maxlength="160" placeholder="예: 첫 수확"></label>
      <label>작물 기록<textarea class="section-body" rows="6" maxlength="20000" required placeholder="성장 상태, 수확, 관리 내용 등을 자유롭게 기록하세요."></textarea></label>
      <fieldset class="tag-field"><legend>활동 태그</legend><div class="tag-options"></div></fieldset>
    </article>
  </template>
  <script src="journal.js?v=1" defer></script>
</body>
</html>
