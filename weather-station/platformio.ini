[platformio]
default_envs = firebeetle_c6

[env:firebeetle_c6]
platform = espressif32@6.12.0
board = esp32-c6-devkitc-1
framework = espidf
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -I include

; Pin map and 4MB flash are overridden for DFRobot DFR1075 V1.2.
; This project never uses the tower's source files or secrets.

[env:firebeetle_c6_compilecheck]
extends = env:firebeetle_c6
build_flags = ${env:firebeetle_c6.build_flags} -D STATION_COMPILE_CHECK
; Never flash this environment: dummy settings retain Wi-Fi/TLS/OTA code during
; optimization, allowing a full-path build without reading production secrets.
